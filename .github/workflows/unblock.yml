name: unblock dependents

# GitHub has no native "blocked by" relation, so this repo uses a convention:
# an issue body carries `Blocked by #N` lines, and carries the `blocked` label
# while any of those are open. That convention is load-bearing -- it is the only
# thing stopping work from starting on an issue whose foundation has not landed
# -- so it is maintained here rather than by hand.
#
# On merge, every issue blocked by the just-closed issue is re-evaluated: if all
# of its blockers are now closed it becomes `ready`, otherwise it stays `blocked`.

on:
  pull_request:
    types: [closed]
  issues:
    types: [closed, reopened]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  reconcile:
    # Only a merged PR counts; a closed-without-merge PR blocks nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;

            // Re-evaluate every open issue rather than only the dependents of
            // the issue that just closed. It is one extra API page for a
            // backlog this size, and it makes the job self-healing: a label
            // edited by hand, or a merge that bypassed this workflow, still
            // converges on the next run.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });

            const state = new Map();
            const isOpen = async (number) => {
              if (!state.has(number)) {
                try {
                  const {data} = await github.rest.issues.get({owner, repo, issue_number: number});
                  state.set(number, data.state === 'open');
                } catch {
                  state.set(number, false); // unknown issue blocks nothing
                }
              }
              return state.get(number);
            };

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const blockers = [...(issue.body || '').matchAll(/blocked\s+by\s+#(\d+)/gi)]
                .map((m) => Number(m[1]));
              if (blockers.length === 0) continue;

              const open = [];
              for (const number of blockers) {
                if (await isOpen(number)) open.push(number);
              }

              const labels = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
              const shouldBlock = open.length > 0;
              const add = shouldBlock ? 'blocked' : 'ready';
              const remove = shouldBlock ? 'ready' : 'blocked';

              if (!labels.includes(add)) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number, labels: [add],
                });
                core.info(`#${issue.number}: +${add}` +
                  (shouldBlock ? ` (waiting on ${open.map((n) => '#' + n).join(', ')})` : ''));
              }
              if (labels.includes(remove)) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: issue.number, name: remove,
                }).catch(() => {});
              }
            }
