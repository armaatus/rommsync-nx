name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, fast checks on the scripts that stand up everyone's environment. If
  # one of these is broken, every worktree created afterwards is broken too.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: |
          for script in scripts/orca/*.sh server/testing/*.sh; do
            bash -n "$script"
          done
      - name: Python compiles
        run: python3 -m compileall -q server/
      - name: Compose file is valid
        run: ./scripts/orca/compose.sh config --quiet

  # The primary rig (docs/TESTING.md): the core engine built natively and run
  # against a REAL RomM 5.2.0 in Docker, reached through the fault proxy so the
  # failure paths are exercised too.
  #
  # ROMMSYNC_REQUIRE_RIG=ON means an unreachable fixture FAILS here rather than
  # skipping. A green run must mean the tests actually ran.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libcurl4-openssl-dev ccache

      - name: Derive environment and seed ROM fixtures
        run: |
          ./scripts/orca/env.sh
          ./server/testing/seed.sh

      - name: Start the RomM fixture
        run: ./scripts/orca/compose.sh up -d

      - name: Wait for RomM
        run: |
          set -a; . ./.env; set +a
          curl -fsS --retry 60 --retry-delay 5 --retry-all-errors --retry-connrefused \
            -o /dev/null -w 'romm: %{http_code}\n' "$ROMM_BASE_URL/api/heartbeat"
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors --retry-connrefused \
            -o /dev/null -w 'proxy: %{http_code}\n' "$PROXY_BASE_URL/api/heartbeat"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DROMMSYNC_REQUIRE_RIG=ON
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Both go through the wrapper: every step is a fresh shell, and compose
      # reads .env from the compose file's directory, not the repo root -- so a
      # bare `docker compose` here would target the default project and dump
      # nothing, exactly when a failure needs the logs.
      - name: RomM logs on failure
        if: failure()
        run: ./scripts/orca/compose.sh logs --tail=200

      - name: Tear down
        if: always()
        run: ./scripts/orca/compose.sh down -v || true

  # The Switch targets. devkitPro builds them but nothing runs them -- Horizon
  # behaviour is proven on the Ryujinx rung and, last, on hardware (M8).
  #
  # The Makefiles do not exist yet; M0-3 completes this job. Until then it
  # reports honestly rather than pretending to have built something.
  switch-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build sysmodule
        run: |
          if [ -f sysmodule/Makefile ]; then
            make -C sysmodule -j"$(nproc)"
          else
            echo "::notice::sysmodule/Makefile not present yet — completed by M0-3"
          fi

      - name: Build overlay
        run: |
          if [ -f overlay/Makefile ]; then
            make -C overlay -j"$(nproc)"
          else
            echo "::notice::overlay/Makefile not present yet — completed by M0-3"
          fi

      - name: Collect artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rommsync-nx
          path: |
            sysmodule/**/*.nsp
            overlay/**/*.ovl
          if-no-files-found: ignore
