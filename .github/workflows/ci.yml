name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]

jobs:
  # Rung 1 of the test ladder (docs/TESTING.md): the core engine compiled with the
  # native toolchain and run against the mock RomM. This is what proves the logic
  # off-console — no Switch, no real server. See issues M0-2, M0-3, M0-5.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build host harness + run tests (mock RomM)
        run: |
          if [ -f Makefile ] && grep -q '^test:' Makefile 2>/dev/null; then
            make test
          elif [ -f host/Makefile ]; then
            make -C host test
          else
            echo "host harness not present yet - skipping (M0-2 / M0-5)"
          fi

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest   # devkitA64 + libnx + portlibs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # libultrahand for the overlay

      - name: Build sysmodule
        run: |
          if [ -f sysmodule/Makefile ]; then
            make -C sysmodule -j"$(nproc)"
          else
            echo "sysmodule/Makefile not present yet - skipping (M0-3)"
          fi

      - name: Build overlay
        run: |
          if [ -f overlay/Makefile ]; then
            make -C overlay -j"$(nproc)"
          else
            echo "overlay/Makefile not present yet - skipping (M0-3)"
          fi

      - name: Collect artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rommsync-nx
          path: |
            sysmodule/**/*.nsp
            overlay/**/*.ovl
          if-no-files-found: ignore
