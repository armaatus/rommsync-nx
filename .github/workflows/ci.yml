name: build

on:
  push:
    branches: [main]
    # A `v*` tag is what publishes a release (the `release` job below, and
    # docs/DEVELOPMENT.md#releases). This workflow used to declare
    # `release: types: [created]` instead, and no job consumed it: creating a
    # release published nothing and pushing a tag published nothing, with
    # neither path saying so. One trigger, and `ctest -R release.ci` refuses
    # both being wired at once in either direction.
    tags: ['v*']
  pull_request:
  # On demand, because the one thing you cannot do to a green run is run it
  # again -- and an intermittent failure is diagnosed by repetition. #76 cost
  # several pushes that existed only to make CI run once more.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel supersedes on a BRANCH, never on main. On a branch the newest push is
  # the only one anyone cares about, and cancelling the older run saves minutes.
  # On main every commit is a commit somebody has to be able to trust: two merges
  # close together cancelled the earlier one's build, so that sha's verification
  # simply never happened and nothing re-ran it. A cancelled run is not a green
  # run, and "main is green" has to mean every commit on it was actually checked.
  #
  # It happened the morning this was written: #105 and #102 merged seconds apart
  # and #105's main build was cancelled mid-flight.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Cheap, fast checks on the scripts that stand up everyone's environment. If
  # one of these is broken, every worktree created afterwards is broken too.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: |
          for script in scripts/*.sh scripts/orca/*.sh server/testing/*.sh; do
            bash -n "$script"
          done
      - name: Python compiles
        run: python3 -m compileall -q server/
      - name: Compose file is valid
        run: ./scripts/orca/compose.sh config --quiet

      # An invalid workflow file is silent: GitHub creates a run with no jobs and
      # the check it was meant to report never appears at all. With `merge-gate`
      # required, that reads as "pending forever" and nothing can merge. Cheap to
      # check, and it has already caught one.
      - name: Workflows are valid
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      # core/ is the half of the tree that has to compile for Horizon as well as
      # for a laptop, and the whole point of the HttpClient interface is that no
      # sync, download or auth code names a transport. Both rules are one
      # question: does anything in core/ include something that is neither a
      # standard header nor one of ours?
      - name: core/ includes nothing platform-specific
        run: |
          stray=$(grep -rnE '^[[:space:]]*#[[:space:]]*include' core/include core/src \
                  | grep -vE 'include <[a-z_]+>' \
                  | grep -vE 'include "rommsync/' || true)
          if [ -n "$stray" ]; then
            echo "$stray"
            echo "::error::core/ may include only standard headers and rommsync/ ones."
            echo "Platform detail belongs behind an interface -- see core/AGENTS.md."
            exit 1
          fi

  # The primary rig (docs/TESTING.md): the core engine built natively and run
  # against a REAL RomM 5.2.0 in Docker, reached through the fault proxy so the
  # failure paths are exercised too.
  #
  # ROMMSYNC_REQUIRE_RIG=ON means an unreachable fixture FAILS here rather than
  # skipping. A green run must mean the tests actually ran.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libcurl4-openssl-dev ccache

      - name: Derive environment and seed ROM fixtures
        run: |
          ./scripts/orca/env.sh
          ./server/testing/seed.sh

      - name: Start the RomM fixture
        run: ./scripts/orca/compose.sh up -d

      - name: Wait for RomM
        run: |
          set -a; . ./.env; set +a
          curl -fsS --retry 60 --retry-delay 5 --retry-all-errors --retry-connrefused \
            -o /dev/null -w 'romm: %{http_code}\n' "$ROMM_BASE_URL/api/heartbeat"
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors --retry-connrefused \
            -o /dev/null -w 'proxy: %{http_code}\n' "$PROXY_BASE_URL/api/heartbeat"

      # A running RomM is not a usable one: the staged roms are not imported
      # until something drives the socket.io scan, and rig.provisioned fails on
      # the empty library that leaves behind. Mirrors scripts/orca/setup.sh.
      - name: Provision the fixture
        run: |
          set -a; . ./.env; set +a
          # Through the same picker setup.sh uses, not a bare `python3`. The
          # runner's default interpreter satisfies the floor today, so this is
          # not load-bearing yet -- but the moment a pin needs a Python newer
          # than ubuntu-latest ships, a bare `python3` here reproduces the
          # exact failure setup.sh now guards against, in CI, where the whole
          # point is to catch it first.
          . ./scripts/orca/lib.sh
          PYTHON="$(orca_pick_python)" || {
            echo "no Python >= ${ORCA_PYTHON_MIN_MAJOR}.${ORCA_PYTHON_MIN_MINOR} on this runner; tried:"
            orca_python_rejections
            exit 1
          }
          "$PYTHON" -m venv .venv
          ./.venv/bin/pip install -q --disable-pip-version-check -r server/requirements.txt
          ./.venv/bin/python server/testing/provision.py --base-url "$ROMM_BASE_URL"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DROMMSYNC_REQUIRE_RIG=ON
          cmake --build build

      # Includes contract.captures, which drives probe_contract.py through the
      # full unattended flow and diffs the result against server/contract/captures/.
      # That is how a RomM bump surfaces as a red build rather than as docs that
      # quietly describe a server nobody runs any more.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Both go through the wrapper: every step is a fresh shell, and compose
      # reads .env from the compose file's directory, not the repo root -- so a
      # bare `docker compose` here would target the default project and dump
      # nothing, exactly when a failure needs the logs.
      - name: RomM logs on failure
        if: failure()
        run: ./scripts/orca/compose.sh logs --tail=200

      - name: Tear down
        if: always()
        run: ./scripts/orca/compose.sh down -v || true

  # The Switch targets. devkitPro builds them but nothing runs them -- Horizon
  # behaviour is proven on the Ryujinx rung and, last, on hardware (M8).
  #
  # sysmodule/ compiles every core/ translation unit and links them, so this job
  # is also what proves the portable engine still builds for aarch64. It replaces
  # the -fsyntax-only check that stood in for it while the Makefiles did not
  # exist: a real compile and link catches everything that did, plus the
  # codegen and linker errors it could not see.
  switch-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build sysmodule
        run: make -C sysmodule -j"$(nproc)"

      - name: Build overlay
        run: make -C overlay -j"$(nproc)"

      # The M0-1 spike (tlsprobe/README.md). Built here for the same reason the
      # other two are: it is manually launched, never installed, and a broken
      # cross-compile of it should be visible on the push that broke it rather
      # than on the day someone goes to run the experiment.
      - name: Build the TLS probe
        run: make -C tlsprobe -j"$(nproc)"

      # `make` exiting 0 is not the same as having produced something loadable,
      # and upload-artifact would happily publish an empty set. An .ovl without
      # its ULTR signature is the sharp case: it builds, it uploads, and
      # Ultrahand silently does not list it (overlay/README.md).
      - name: Artifacts are what they claim to be
        run: |
          set -eu
          test -s sysmodule/sys-rommsync.nsp || {
            echo "::error::sysmodule built no .nsp"; exit 1; }
          test -s overlay/ovl-rommsync.ovl || {
            echo "::error::overlay built no .ovl"; exit 1; }
          # PFS0 is the ExeFS container magic; a .nsp that is not one is not
          # something Atmosphere will load.
          [ "$(head -c 4 sysmodule/sys-rommsync.nsp)" = "PFS0" ] || {
            echo "::error::sys-rommsync.nsp is not a PFS0 archive"; exit 1; }
          [ "$(tail -c 4 overlay/ovl-rommsync.ovl)" = "ULTR" ] || {
            echo "::error::ovl-rommsync.ovl is missing its ULTR signature"; exit 1; }
          test -s tlsprobe/rommsync-tlsprobe.nro || {
            echo "::error::tlsprobe built no .nro"; exit 1; }
          # NRO0 at offset 0x10; the first 16 bytes are the entry branch.
          [ "$(dd if=tlsprobe/rommsync-tlsprobe.nro bs=1 skip=16 count=4 \
                 2>/dev/null)" = "NRO0" ] || {
            echo "::error::rommsync-tlsprobe.nro is not an NRO"; exit 1; }

      - name: Collect artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rommsync-nx
          path: |
            sysmodule/sys-rommsync.nsp
            overlay/ovl-rommsync.ovl
            tlsprobe/rommsync-tlsprobe.nro
          if-no-files-found: error

      # Packaged on every push, not only on a tag. `ctest -R package.builds` is the
      # only other thing that runs scripts/package.sh inside this container, and
      # it skips on every runner `host-tests` uses -- so without this step a
      # failure specific to packaging here (a missing `zip`, a tool the image
      # dropped) would first appear on a tag, which is the one moment it must
      # not. The zip is not uploaded: the artifact above stays the loose debug
      # drop, and the archive is a RELEASE asset (#32, #34).
      #
      # AFTER the upload, not before: a failure here is exactly when the three
      # loose files are worth having, and a step that fails before them takes
      # them with it.
      - name: Package
        run: scripts/package.sh

  # A tag becomes something a user can download. Nothing else publishes: the
  # `if` below is what keeps this job off every other push, since the tag
  # trigger runs the whole workflow.
  #
  # `needs` is the point of the job as much as the upload is. host-tests is
  # where `ctest -R version.tag` runs -- GitHub sets GITHUB_REF for every step
  # on a tag push, so that entry sees the tag and fails when it disagrees with
  # VERSION -- switch-build is where the three targets and the packaging are
  # proven, and static is where this very workflow is checked for validity. A
  # release that skipped any of them would be bytes nobody tested.
  #
  # Those three say the tagged commit is GOOD. They do not say it was reviewed:
  # a tag can be pushed at any commit on any branch, and this job would publish
  # it. The `git merge-base` step below is what closes that, since every commit
  # on main went through a pull request and the merge gate.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static, host-tests, switch-build]
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    # The default token is read-only. Creating a release and attaching assets to
    # it is the only write this workflow does, and it is scoped to this job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # scripts/release-notes.sh lists the commits since the previous tag,
          # and the default shallow checkout has neither those commits nor the
          # tags to find them by. The notes would come out empty rather than
          # wrong, which is worse: nothing would say so.
          fetch-depth: 0

      # Before anything is built, because everything below is named after
      # VERSION: the archive, the checksums, the release title. The same script
      # `host-tests` already ran as `version.tag`, run again here because this
      # job is the one that would publish the mismatch.
      - name: The tag and VERSION agree
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./tests/test_release.sh version

      # ...and the commit it names is on main. Nothing else here would notice
      # `git push origin v9.9.9` pointing at a branch head: the build would be
      # green, because the build is green on that branch, and a public release
      # would be cut from code that never went through a pull request or the
      # merge gate. fetch-depth: 0 above is what makes origin/main present.
      - name: The tag is on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::${GITHUB_REF_NAME} is not an ancestor of main."
            echo "Releases are cut from main, which is the only branch every"
            echo "commit reached through a reviewed pull request."
            exit 1
          }

      # Read once, here, and used by every step below: the archive's name, the
      # release's prerelease flag and the checksum line all derive from this one
      # string, and a second reader is a second thing that can disagree with it.
      # The prerelease rule lives in release-notes.sh so `ctest -R
      # release.prerelease` can exercise it without a tag or a token.
      - name: Read VERSION
        run: |
          set -euo pipefail
          # Assigned before they are written, and checked. `echo "X=$(cmd)" >>`
          # takes echo's exit status, not the command's, so `set -e` cannot see
          # a failing script -- PRERELEASE would land empty and the Publish step
          # reads an empty string as "not a prerelease", publishing a v0.2.0-rc1
          # as stable. That is the exact failure release.prerelease exists for,
          # arriving by the one route that test cannot see.
          version="$(sed -n '1{s/^[[:space:]]*//;s/[[:space:]]*$//;p;}' VERSION)"
          [ -n "$version" ] || { echo "::error::VERSION is empty"; exit 1; }
          prerelease="$(./scripts/release-notes.sh --prerelease)"
          case "$prerelease" in
            true|false) ;;
            *) echo "::error::--prerelease answered '$prerelease'"; exit 1 ;;
          esac
          {
            echo "VERSION=$version"
            echo "PRERELEASE=$prerelease"
          } >> "$GITHUB_ENV"

      # The same three builds switch-build runs, in the same image. tlsprobe is
      # built but never packaged -- it is a spike, never installed
      # (tlsprobe/README.md) -- and it is built here so a release cannot be cut
      # from a tree where it stopped compiling.
      - name: Build sysmodule
        run: make -C sysmodule -j"$(nproc)"

      - name: Build overlay
        run: make -C overlay -j"$(nproc)"

      - name: Build the TLS probe
        run: make -C tlsprobe -j"$(nproc)"

      # The zip is the only thing a user should ever download: a loose .nsp under
      # its build name installs cleanly and does nothing at all (#32).
      - name: Package
        run: scripts/package.sh

      # Computed beside the build, in the same job. The archive is
      # byte-deterministic for one `zip` build, which is what makes this a
      # statement about these bytes -- a checksum computed anywhere else is a
      # checksum of something else. Verifying it is a later step's job, and it
      # deliberately happens after the upload rather than here: `sha256sum -c`
      # run on the file the digest was taken from seconds earlier proves only
      # that the disk did not change under us.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum "rommsync-nx-$VERSION.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          set -euo pipefail
          ./scripts/release-notes.sh --checksums dist/SHA256SUMS > notes.md
          cat notes.md

      # `gh` and `jq` are not in this image and `curl`, `python3` and `git` are,
      # so the REST API is called directly rather than through either -- and a
      # third-party action is supply-chain surface on the one file that can
      # disable the checks gating its own pull request.
      #
      # A tag that already has a release makes the POST a 422 and `curl -f`
      # makes that a red job. Deliberate: the alternative is attaching these
      # bytes to a release built from other ones. Re-cutting a tag means
      # deleting its release first.
      #
      # The release is created as a DRAFT and stays one until the assets are up
      # and verified. A non-draft release exists the moment it is POSTed, and a
      # 502 or a truncated upload one second later leaves a live, public page
      # advertising a download that is missing or corrupt -- which, given the
      # 422 above, then needs a human to delete before the tag can be re-cut. A
      # draft is visible only to people who can write to the repo.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          python3 - "$TAG" "$PRERELEASE" notes.md > body.json <<'PY'
          import json, sys
          tag, prerelease, notes = sys.argv[1], sys.argv[2] == "true", sys.argv[3]
          with open(notes, encoding="utf-8") as f:
              body = f.read()
          print(json.dumps({"tag_name": tag, "name": tag, "body": body,
                            "draft": True, "prerelease": prerelease}))
          PY

          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @body.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" > release.json

          # The upload host differs from the API host, and the URL comes back as
          # an RFC 6570 template -- `...{?name,label}` -- so the parameters are
          # appended to the part before the brace rather than to the template.
          upload="$(python3 -c 'import json; print(json.load(open("release.json"))["upload_url"].split("{")[0])')"
          python3 -c 'import json; print(json.load(open("release.json"))["id"])' > release-id

          for asset in "dist/rommsync-nx-$VERSION.zip" dist/SHA256SUMS; do
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$asset" \
              "$upload?name=$(basename "$asset")" \
              > "upload-$(basename "$asset").json"
            echo "uploaded $(basename "$asset")"
          done

      # The check the published checksum is actually making. Recomputing a digest
      # over the file that was just written proves only that the disk did not
      # change under us -- so this pulls both assets back OUT of the release,
      # through the API, and runs `sha256sum -c` on what a user would download.
      # A truncated upload is the failure it catches, and it is the only failure
      # here that produces a release page that looks completely fine.
      - name: The published checksums match the published asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p published
          for asset in "rommsync-nx-$VERSION.zip" SHA256SUMS; do
            id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' \
                  "upload-$asset.json")"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -o "published/$asset"
          done
          cd published
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      # Only now does anyone outside the repo see it. Everything above can fail
      # with nothing published but a draft, which is the state a human deletes
      # without a user ever having seen a broken download.
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"draft": false}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$(cat release-id)" \
            > /dev/null
          echo "published $GITHUB_REF_NAME"
