name: agent config

# The lint, on every pull request: `bash -n` over every script, shellcheck, and
# the two `--selftest`s. It is the same check as `./tests/run.sh lint`, and it is
# a REQUIRED check, so it carries no `paths:` filter -- a required check that is
# filtered out never reports, which reads as "pending forever" rather than
# "skipped" and the pull request can never merge.
#
# There was a second job here: one headless `claude` session per case in
# `evals/cases/`, scoring what the agent actually answered. It went with
# armaatus/autofleet#153, along with the cases -- which were a C++ project's
# (#8) and had drifted from the CLAUDE.md they scored against (#97). A model
# call that warns rather than fails is a check nobody reads.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: configuration is well-formed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The runner has shellcheck preinstalled, and `evals/run.sh` says so
      # rather than passing silently when it is absent -- but it is not fatal
      # there, because a laptop without it should still be able to run the rest.
      # Here it must actually run, so the version is checked out loud.
      - name: shellcheck is present
        run: shellcheck --version

      - name: Check
        run: ./evals/run.sh
